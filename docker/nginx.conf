server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Service Worker deve ser servido com o caminho correto e sem cache
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }

  # Manifesto da PWA
  location = /manifest.json {
    add_header Cache-Control "no-cache";
  }

  # Assets com cache agressivo (hash no nome)
  location ~ /assets/.*\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Fallback para SPA - redireciona tudo para o index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Headers de segurança
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
}
